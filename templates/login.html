<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Market Sense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #181c27;
            --surface-2: #1f2535;
            --border: rgba(255,255,255,0.08);
            --border-focus: #6c7cff;
            --text: #e8eaf6;
            --text-muted: #7b829a;
            --accent: #6c7cff;
            --accent-hover: #5a69f0;
            --accent-glow: rgba(108,124,255,0.18);
            --error: #ff5c5c;
            --error-bg: rgba(255,92,92,0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% -20%, rgba(108,124,255,0.12) 0%, transparent 70%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #6c7cff 0%, #a78bfa 100%);
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(108,124,255,0.3);
        }

        .brand-logo svg { width: 26px; height: 26px; color: #fff; }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .brand-title span { color: var(--accent); }

        .brand-byline {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .error-box {
            background: var(--error-bg);
            border: 1px solid rgba(255,92,92,0.25);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--error);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text);
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }

        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input::placeholder { color: var(--text-muted); font-weight: 400; }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            padding-right: 44px;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }

        .toggle-pw:hover { color: var(--text); }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #6c7cff 0%, #a78bfa 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.18s, transform 0.12s;
            box-shadow: 0 4px 18px rgba(108,124,255,0.35);
        }

        .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .btn-login.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0 20px;
        }

        .role-hint {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .role-chip {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
        }

        .role-chip-icon { font-size: 16px; display: block; margin-bottom: 3px; }
        .role-chip-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .role-chip-desc { font-size: 10px; color: var(--text-muted); opacity: 0.7; margin-top: 1px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
            </svg>
        </div>
        <div class="brand-title">Market <span>Pulse</span></div>
        <div class="brand-byline">IQlytics Solutions Pvt Ltd</div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in with your registered email address.</p>

    {% if error %}
    <div class="error-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/api/login" id="loginForm">
        <div class="form-group">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="your.email@company.com" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password" tabindex="-1">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>
        <button class="btn-login" type="submit" id="submitBtn">Sign In</button>
    </form>

</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.textContent = 'Signing in…';
        btn.classList.add('loading');
        btn.disabled = true;
    });

    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePw');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOpen  = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const eyeSlash = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    toggleBtn.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        eyeIcon.innerHTML = show ? eyeSlash : eyeOpen;
        toggleBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
</script>
</body>
</html>
